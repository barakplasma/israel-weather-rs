version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # Must stay on cached-path's reqwest major; see Cargo.toml.
      - dependency-name: reqwest
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Third-party clients in the compatibility suite: new releases should keep working.
  - package-ecosystem: pip
    directory: /compat/python
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /compat/go
    schedule:
      interval: weekly
