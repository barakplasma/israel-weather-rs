name: E2E test every 6 hours

on:
  schedule:
    - cron: "1 6/6 * * *"
  workflow_dispatch:


jobs:
  end-to-end-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install jq curl

      - name: Get latest release asset
        # Exact asset name: a substring match also hits weather-server-x86_64-unknown-linux-gnu.
        run: curl -fLO "https://github.com/barakplasma/israel-weather-rs/releases/latest/download/weather-x86_64-unknown-linux-gnu"

      - name: Make executable
        run: chmod +x ./weather-x86_64-unknown-linux-gnu

      - name: Get Weather
        run: ./weather-x86_64-unknown-linux-gnu -n 24 | tee weather.json

      - uses: actions/upload-artifact@v7
        with:
          name: weather.json
          path: weather.json
          retention-days: 14

      - name: Will it rain?
        run: echo "RAIN=$(jq "max_by(.Rain).Rain > 0" weather.json)" >> $GITHUB_ENV

      - name: Send notification
        run: |
          curl -H Priority:$([ "$RAIN" == "true" ] && echo 4 || echo 1) \
          -H Click:"https://ims.gov.il/en/cityPortal?lid=84" \
          --url-query "title=$(if [ "$RAIN" == "true" ]; then echo "Rain Expected"; else echo "No Rain"; fi)" \
          --url-query message@ntfy-template.tmpl \
          -H Content-Type:"application/json" \
          -H Template:yes \
          --data @weather.json \
          'ntfy.sh/${{ secrets.NTFY_TOPIC }}'
