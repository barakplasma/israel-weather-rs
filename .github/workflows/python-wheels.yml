name: Python wheels
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also build Windows and macOS wheels'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.all_platforms && '[{"runner":"ubuntu-latest","target":"x86_64"},{"runner":"ubuntu-24.04-arm","target":"aarch64"},{"runner":"macos-latest","target":"aarch64"},{"runner":"macos-15-intel","target":"x86_64"},{"runner":"windows-latest","target":"x86_64"}]' || '[{"runner":"ubuntu-latest","target":"x86_64"},{"runner":"ubuntu-24.04-arm","target":"aarch64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ runner.os == 'Linux' && '2_28' || 'auto' }}
          before-script-linux: dnf install -y perl perl-IPC-Cmd
          rust-toolchain: '1.98'
          args: --release --manifest-path crates/weather-python/Cargo.toml --out dist
      - name: Validate wheel metadata
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl
          python -c "from pathlib import Path; wheels=list(Path('dist').glob('*.whl')); assert len(wheels)==1 and '-cp310-abi3-' in wheels[0].name, wheels"
      - name: Install and test wheel on Python 3.10
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install dist/*.whl
          python -m pip check
          python -m pytest crates/weather-python/tests
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install and test same ABI3 wheel on Python 3.14
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install dist/*.whl
          python -m pip check
          python -m pytest crates/weather-python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
  release:
    if: github.event_name == 'release'
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
