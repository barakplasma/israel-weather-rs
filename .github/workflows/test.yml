name: Test

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '.github/**'
      - '.vscode/**'

  # Any base branch, so stacked PRs get CI too.
  pull_request:
    paths-ignore:
      - '.github/**'
      - '.vscode/**'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo test --all-features
      # The web UI's model and chart logic, natively.
      - run: cargo test -p weather-web
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p weather-web --target wasm32-unknown-unknown -- -D warnings
  # Release build of the server with the real web UI embedded.
  server-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: ./.github/actions/build-web
      - run: cargo build --release --features server
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo run
