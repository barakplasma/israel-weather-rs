[package]
name = "weather-web"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
description = "Web UI for `weather serve`, built with trunk and embedded in the server binary"
license = "MIT"
publish = false

[dependencies]
weather-api = { path = "../crates/weather-api" }
leptos = { version = "0.8.22", features = ["csr"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Coordinates", "DomRect", "Element", "Geolocation", "Navigator", "PermissionState",
    "PermissionStatus", "Permissions", "PointerEvent", "Position", "PositionError",
    "ServiceWorkerContainer", "Storage", "Window",
] }
console_error_panic_hook = "0.1.7"

[lints.rust]
unsafe_code = "forbid"
