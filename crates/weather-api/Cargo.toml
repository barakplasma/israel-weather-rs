[package]
name = "weather-api"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
description = "Wire types shared by the israel-weather-rs server and its web UI"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
