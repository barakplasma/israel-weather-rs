[package]
name = "israel-weather-python"
version = "0.8.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
israel-weather-rs = { path = "../..", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
