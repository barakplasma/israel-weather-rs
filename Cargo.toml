[package]
name = "israel-weather-rs"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
description = "a utility to download the israeli weather forecast from ims.gov.il , save it to a cache, and allow recall at any point in the future from the cache as filtered by location and current time. meant for alerting the user to expected rain"
readme = "README.md"
repository = "https://github.com/barakplasma/israel-weather-rs"
license = "MIT"

[[bin]]
name = "weather"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/weather-{ target }{ binary-ext }"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"

[lints.rust]
unsafe_code = "forbid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
cached-path = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
cron = { version = "0.17.0", optional = true }
# Must match the reqwest major cached-path uses (0.12), so gzip applies to its
# downloads too. Its default-tls is native-tls (OpenSSL): rustls-platform-verifier
# (0.13's default) panics on Android outside an app (no JVM context).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "fmt",
    "json",
    "env-filter",
    "local-time",
] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[target.'cfg(target_arch = "arm")'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[features]
# `weather serve`: HTTP server with Open-Meteo / MET Norway compatible APIs and an embedded web UI.
server = ["dep:axum", "dep:tokio", "dep:cron"]

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
